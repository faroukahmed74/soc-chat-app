<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SOC Chat App - Secure messaging for friends and groups">
  
  <!-- Responsive viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Local network access -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="SOC Chat App">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SOC Chat App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg"/>
  <link rel="icon" type="image/png" href="icons/favicon.png"/>
  <link rel="shortcut icon" type="image/svg+xml" href="icons/favicon.svg"/>
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <title>SOC Chat App</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Emoji font support for offline mode -->
  <style>
    /* Ensure emoji characters use system emoji fonts for offline support */
    @font-face {
      font-family: 'EmojiFallback';
      src: local('Apple Color Emoji'),
           local('Segoe UI Emoji'),
           local('Segoe UI Symbol'),
           local('Noto Color Emoji'),
           local('Android Emoji'),
           local('EmojiSymbols'),
           local('EmojiOne Mozilla'),
           local('Twemoji Mozilla'),
           local('Segoe UI Historic');
      unicode-range: U+1F300-1F9FF, U+2600-26FF, U+2700-27BF, U+1F600-1F64F, U+1F300-1F5FF, U+1F680-1F6FF, U+1F1E0-1F1FF, U+1F900-1F9FF, U+1FA00-1FA6F, U+1FA70-1FAFF, U+200D, U+20E3, U+FE0F;
    }
    
    /* Apply emoji font to all text elements */
    body, * {
      font-family: "NotoColorEmoji", Arial, Helvetica, "Segoe UI", Tahoma, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", "Android Emoji", "EmojiSymbols", "EmojiOne Mozilla", "Twemoji Mozilla", "Segoe UI Historic", sans-serif !important;
    }
  </style>

  <!-- Responsive Configuration -->
  <script>
    // Set CanvasKit base URL early to prevent CDN loading
    window.flutterConfiguration = {
      canvasKitBaseUrl: '/canvaskit/',
      useHostedFonts: false,
      assetBase: window.location.origin + '/'
    };
    
    // Ensure _flutter object exists and set CanvasKit path
    if (!window._flutter) {
      window._flutter = {};
    }
    window._flutter.canvasKitBaseUrl = '/canvaskit/';
    
    // Intercept fetch requests to prevent CanvasKit CDN loading
    (function() {
      const originalFetch = window.fetch;
      window.fetch = function(...args) {
        const u = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url) || '';
        if (typeof u === 'string' && u.includes('gstatic.com/flutter-canvaskit')) {
          const newUrl = u.endsWith('.wasm') ? '/canvaskit/canvaskit.wasm'
                        : u.endsWith('.js') ? '/canvaskit/canvaskit.js'
                        : '/canvaskit/canvaskit.js';
          args[0] = newUrl;
        }
        return originalFetch.apply(this, args);
      };
    })();
  (function(){
      function removeGF() {
        try {
          const links = Array.from(document.querySelectorAll('link[rel="stylesheet"], link[href]'));
          links.filter(l => /fonts\.googleapis\.com|fonts\.gstatic\.com/i.test(l.href || ''))
               .forEach(l => { try { l.parentNode && l.parentNode.removeChild(l); } catch(_){} });
        } catch(_) {}
      }
      removeGF();
      const obs = new MutationObserver(() => removeGF());
      obs.observe(document.documentElement || document.body, { childList: true, subtree: true });
      const origAppend = Element.prototype.appendChild;
      Element.prototype.appendChild = function(node){
        try {
          if (node && node.tagName === 'LINK') {
            const href = node.getAttribute('href') || '';
            if (/fonts\.googleapis\.com|fonts\.gstatic\.com/i.test(href)) { return node; }
          }
        } catch(_) {}
        return origAppend.call(this, node);
      };
    })();
  </script>
  <script src="responsive_config.js"></script>
  <script>
    window.__AUTO_FLUTTER_LOAD__ = false;
  </script>
  
  <script>
    const serviceWorkerVersion = null;
  </script>
  
  <!-- Firebase SDK for Web FCM - Load conditionally for offline support -->
  <!-- Only load Firebase if online, app works offline without it -->
  <script>
    // Conditionally load Firebase only when online (for web notifications)
    // App works completely offline without Firebase
    (function() {
      function loadFirebaseIfOnline() {
        // Check if online
        if (navigator.onLine) {
          // Try to load Firebase, but don't block if it fails
          const firebaseApp = document.createElement('script');
          firebaseApp.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js';
          firebaseApp.onerror = function() {
            console.log('Firebase not available (offline mode)');
          };
          
          const firebaseMessaging = document.createElement('script');
          firebaseMessaging.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js';
          firebaseMessaging.onerror = function() {
            console.log('Firebase messaging not available (offline mode)');
          };
          
          document.head.appendChild(firebaseApp);
          firebaseApp.onload = function() {
            document.head.appendChild(firebaseMessaging);
          };
        } else {
          console.log('Offline mode: Firebase not loaded');
        }
      }
      
      // Load Firebase if online
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadFirebaseIfOnline);
      } else {
        loadFirebaseIfOnline();
      }
      
      // Also try to load when coming back online
      window.addEventListener('online', loadFirebaseIfOnline);
    })();
  </script>
  
  <!-- Flutter bootstrap and loader -->
  <script src="flutter.js" defer></script>
  <script src="flutter_bootstrap.js" defer></script>
</head>
<body>
  <!-- SOC Chat App Logo and Loading Screen -->
  <div id="loading" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    font-family: Arial, sans-serif;
  ">
    <!-- App Logo -->
    <div style="
      width: 120px;
      height: 120px;
      background: white;
      border-radius: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      padding: 20px;
    ">
      <img src="assets/logo/SOCLogo.png" alt="SOC Chat App Logo" style="
        width: 100%;
        height: 100%;
        object-fit: contain;
      " onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'width:80px;height:80px;background:#667eea;border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;font-size:40px;\'>💬</div>';">
    </div>
    
    <!-- App Title -->
    <h1 style="
      color: white;
      font-size: 32px;
      font-weight: bold;
      margin: 0 0 8px 0;
      text-align: center;
    ">SOC Chat App</h1>
    
    <!-- Subtitle -->
    <p style="
      color: rgba(255,255,255,0.8);
      font-size: 18px;
      margin: 0 0 32px 0;
      text-align: center;
    ">Secure messaging for friends and groups</p>
    
    <!-- Loading spinner -->
    <div style="
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    "></div>
    
    <!-- Loading text -->
    <p style="
      color: rgba(255,255,255,0.7);
      font-size: 16px;
      margin: 24px 0 0 0;
      text-align: center;
    ">Loading...</p>
  </div>

  <style>
    /* Arabic font support for web - Flutter will handle font loading automatically */
    /* These @font-face declarations ensure fonts are available before Flutter loads */
    /* Flutter web automatically includes fonts from pubspec.yaml, but we add fallback CSS */
    
    /* Emoji font fallbacks for proper emoji rendering on web */
    @font-face {
      font-family: 'EmojiFont';
      src: local('Apple Color Emoji'),
           local('Segoe UI Emoji'),
           local('Segoe UI Symbol'),
           local('Noto Color Emoji'),
           local('Android Emoji');
      unicode-range: U+1F300-1F9FF, U+2600-26FF, U+2700-27BF, U+1F600-1F64F, U+1F680-1F6FF, U+1F900-1F9FF, U+1FA00-1FA6F, U+1FA70-1FAFF, U+FE00-FE0F;
    }
    
    body {
      font-family: 'NotoSansArabic', 'NotoNaskhArabic', Arial, Helvetica, 'Segoe UI', Tahoma, sans-serif;
      /* Enable emoji rendering with proper font fallback */
      font-feature-settings: 'liga', 'kern';
      text-rendering: optimizeLegibility;
    }
    
    /* Ensure emojis and Arabic text render properly in all text elements */
    * {
      font-family: 'NotoSansArabic', 'NotoNaskhArabic', Arial, Helvetica, 'Segoe UI', Tahoma, 'EmojiFont', sans-serif;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    body {
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (isSecure) {
          navigator.serviceWorker.register('/firebase-messaging-sw.js')
            .then(function(registration) { console.log('Service Worker registered:', registration.scope); })
            .catch(function(error) { console.log('Service Worker registration failed:', error); });
        } else {
          console.log('Skipping SW registration on non-secure origin');
        }
      });
    }
    let startFlutterAttempts = 0;
    const MAX_START_ATTEMPTS = 50; // Max 5 seconds (50 * 100ms)
    
    function startFlutter() {
      try {
        startFlutterAttempts++;
        
        // Safety check: prevent infinite loops
        if (startFlutterAttempts > MAX_START_ATTEMPTS) {
          console.error('Flutter initialization timeout - giving up after', MAX_START_ATTEMPTS, 'attempts');
          document.getElementById('loading').style.display = 'none';
          document.body.innerHTML = '<div style="padding: 20px; text-align: center;"><h2>Failed to load app</h2><p>Please refresh the page.</p></div>';
          return;
        }
        
        // Wait for Flutter scripts to load
        if (typeof _flutter === 'undefined' || !_flutter.loader || !window._flutter.buildConfig) {
          setTimeout(startFlutter, 100);
          return;
        }
        
        // Ensure configuration is set
        if (!window.flutterConfiguration) {
          window.flutterConfiguration = {
            canvasKitBaseUrl: './canvaskit/',
            useHostedFonts: false,
            assetBase: window.location.origin + '/'
          };
        }
        
        // Set CanvasKit base URL early to prevent CDN loading
        if (window._flutter) {
          window._flutter.canvasKitBaseUrl = './canvaskit/';
        }
        
        console.log('Starting Flutter with configuration:', window.flutterConfiguration);
        
        // Suppress service worker errors for HTTP (expected behavior)
        const originalConsoleError = console.error;
        console.error = function(...args) {
          if (args[0] && typeof args[0] === 'string' && args[0].includes('Service Worker API unavailable')) {
            // Suppress service worker errors for HTTP - this is expected
            return;
          }
          originalConsoleError.apply(console, args);
        };
        
        const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        const swSettings = isSecure && serviceWorkerVersion ? { serviceWorkerVersion: serviceWorkerVersion } : null;
        function loadWithRenderer(renderer) {
          const cfg = Object.assign({}, window.flutterConfiguration, renderer ? { renderer } : {});
          return _flutter.loader.load({
            serviceWorkerSettings: swSettings,
            config: cfg,
            onEntrypointLoaded: function(engineInitializer) {
              console.log('Flutter entrypoint loaded, initializing engine...');
              engineInitializer.initializeEngine().then(function(appRunner) {
                console.log('Flutter engine initialized, running app...');
                document.getElementById('loading').style.display = 'none';
                appRunner.runApp();
              }).catch(function(error) {
                console.error('Flutter engine initialization error:', error);
                document.getElementById('loading').style.display = 'none';
              });
            }
          });
        }
        loadWithRenderer('canvaskit').catch(function(err) {
          console.log('CanvasKit failed, falling back to HTML renderer:', err && (err.message || err));
          loadWithRenderer('html');
        });
      } catch (e) {
        console.error('Flutter start error:', e);
        document.getElementById('loading').style.display = 'none';
      }
    }
    
    // Wait for all scripts to load before starting
    window.addEventListener('load', function() {
      // Give scripts a moment to execute
      setTimeout(startFlutter, 200);
    });
    
    // Also try if DOM is already ready
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      setTimeout(startFlutter, 300);
    }
  </script>
</body>
</html>
