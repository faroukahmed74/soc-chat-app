services:
  coturn:
    image: coturn/coturn:latest
    container_name: soc-chat-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "50000-50100:50000-50100/udp"  # Secure: Limited port range (101 ports) - supports 50+ concurrent calls
    environment:
      - EXTERNAL_IP=41.33.106.54
    volumes:
      - ./coturn:/etc/coturn
    command: |
      -n
      --log-file=stdout
      --external-ip=41.33.106.54
      --listening-port=3478
      --tls-listening-port=5349
      --min-port=50000
      --max-port=50100  # Secure: Limited range reduces attack surface by 99.4%
      --realm=soc-chat-app.local
      --user=soc-chat-turn:yG5EJFUdLgT7xqXr
      --no-cli
      --no-tls
      --no-dtls
      --fingerprint
      --lt-cred-mech
      --verbose
