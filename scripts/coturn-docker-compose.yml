services:
  coturn:
    image: coturn/coturn:latest
    container_name: soc-chat-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49200:49152-49200/udp"
    environment:
      - EXTERNAL_IP=10.120.4.230
    volumes:
      - ./coturn:/etc/coturn
    command: |
      -n
      --log-file=stdout
      --external-ip=10.120.4.230
      --listening-port=3478
      --tls-listening-port=5349
      --min-port=49152
      --max-port=65535
      --realm=soc-chat-app.local
      --user=soc-chat-turn:yG5EJFUdLgT7xqXr
      --no-cli
      --no-tls
      --no-dtls
      --fingerprint
      --lt-cred-mech
      --verbose
