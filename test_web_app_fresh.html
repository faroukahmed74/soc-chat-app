<!DOCTYPE html>
<html>
<head>
    <title>Fresh Web App Test</title>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <h1>Fresh Web App Test (No Cache)</h1>
    <p>Testing web app with fresh configuration...</p>
    
    <div id="status">Loading...</div>
    <div id="details"></div>
    
    <script>
        async function testFreshWebApp() {
            const statusDiv = document.getElementById('status');
            const detailsDiv = document.getElementById('details');
            
            try {
                // Test the main web app
                const response = await fetch(window.location.origin + '/', {
                    method: 'GET',
                    cache: 'no-cache',
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                });
                
                if (response.ok) {
                    statusDiv.innerHTML = '<span style="color: green;">✅ Web App Accessible!</span>';
                    detailsDiv.innerHTML = `
                        <h3>Web App Status:</h3>
                        <p><strong>Status:</strong> ${response.status} ${response.statusText}</p>
                        <p><strong>URL:</strong> ${window.location.origin}</p>
                        <p><strong>Content-Type:</strong> ${response.headers.get('content-type')}</p>
                        <hr>
                        <h3>Next Steps:</h3>
                        <p>✅ Web app is accessible</p>
                        <p>🌐 Try accessing: <a href="${window.location.origin}" target="_blank">${window.location.origin}</a></p>
                        <p>🔄 If still getting errors, try hard refresh: Ctrl+F5</p>
                        <p>🗑️ Or clear browser cache for this site</p>
                    `;
                } else {
                    statusDiv.innerHTML = '<span style="color: red;">❌ Web App Error</span>';
                    detailsDiv.innerHTML = `<p>Error: ${response.status} - ${response.statusText}</p>`;
                }
            } catch (error) {
                statusDiv.innerHTML = '<span style="color: red;">❌ Web App Connection Failed</span>';
                detailsDiv.innerHTML = `
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p><strong>Possible causes:</strong></p>
                    <ul>
                        <li>Web server not running</li>
                        <li>Port 8082 blocked</li>
                        <li>Network connectivity issues</li>
                    </ul>
                `;
            }
        }
        
        // Run test when page loads
        testFreshWebApp();
    </script>
</body>
</html>
