<!DOCTYPE html>
<html>
<head>
    <title>Direct CORS Test</title>
    <meta charset="utf-8">
</head>
<body>
    <h1>Direct CORS Test</h1>
    <div id="result">Testing...</div>
    
    <script>
        fetch('http://localhost:3003/health')
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').innerHTML = 
                    '<span style="color: green;">✅ SUCCESS! CORS is working!</span><br>' +
                    'Status: ' + data.status + '<br>' +
                    'Message: ' + data.message;
            })
            .catch(error => {
                document.getElementById('result').innerHTML = 
                    '<span style="color: red;">❌ FAILED: ' + error.message + '</span>';
            });
    </script>
</body>
</html>
